pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'SodiumExample'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// react-native-sodium's android/build.gradle depends on project(':lazysodium-android'),
// which autolinking cannot discover on its own. Consuming apps must include it,
// exactly as the Notesnook app does.
include ':lazysodium-android'
project(':lazysodium-android').projectDir = new File(
        rootProject.projectDir,
        '../node_modules/@ammarahmed/react-native-sodium/android/lazysodium-android/app')
